<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Centred Student Login Form using Flexbox – Ruchir Saxena">
  <title>Student Portal Login – Centred with Flexbox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Fullscreen centering via Flexbox */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #334155;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 2.25rem 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
    }

    .login-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .login-header h1 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 0.35rem;
    }

    .login-header p {
      font-size: 0.875rem;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #1e293b;
    }

    .form-group input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .form-options a {
      color: #2563eb;
      text-decoration: none;
    }

    .btn-submit {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="login-header">
      <h1>Invertis Student Portal</h1>
      <p>Faculty of Computer Applications · BCA (AI)</p>
    </div>

    <form action="#" method="post">
      <div class="form-group">
        <label for="student-id">Student Roll Number / Email</label>
        <input type="text" id="student-id" name="student_id" required placeholder="e.g. saxenaruchir282@gmail.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>

      <div class="form-options">
        <label><input type="checkbox" name="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Sign In to Dashboard</button>
    </form>

    <div class="login-footer">
      <p>&copy; 2026 Invertis University, Bareilly</p>
      <p><small>Created by Ruchir Saxena</small></p>
    </div>
  </main>
</body>

</html>
